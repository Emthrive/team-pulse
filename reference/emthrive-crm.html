<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emthrive · CRM Intern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#050A30;
  --navy-2:#0A1245;
  --navy-3:#111C5C;
  --turq:#19C8DB;
  --gold:#D4AF37;
  --white:#FFFFFF;
  --muted:#8A94C4;
  --line:rgba(25,200,219,.16);
  --red:#FF5C7A;
  --green:#3FD9A0;
  --amber:#FFB020;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 88% -12%, rgba(25,200,219,.13), transparent 60%),
    radial-gradient(800px 500px at 5% 105%, rgba(212,175,55,.09), transparent 60%),
    var(--navy);
  color:var(--white);
  font-family:'Raleway',system-ui,sans-serif;
  font-size:15px;
  line-height:1.45;
  min-height:100vh;
  padding-bottom:70px;
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.mono{font-family:'JetBrains Mono',monospace}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:rgba(5,10,48,.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hbar{display:flex;align-items:center;gap:12px;padding:12px 16px}
.mark{
  width:36px;height:36px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(140deg,var(--turq),#0E7F91);
  display:grid;place-items:center;font-weight:800;color:var(--navy);font-size:15px;
  box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;
}
.htitle{font-size:15px;font-weight:700;line-height:1.1}
.hsub{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.dot.err{background:var(--red)}
.dot.wait{background:var(--amber)}

nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  background:transparent;border:1px solid transparent;color:var(--muted);
  padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap;
  letter-spacing:.02em;
}
nav button.on{background:rgba(25,200,219,.14);border-color:var(--line);color:var(--turq)}

main{padding:16px 14px 40px;max-width:1180px;margin:0 auto}

/* ---------- generic ---------- */
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:var(--r);padding:14px;
}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.sec{margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.sec h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--turq);font-weight:800}
.sec .rule{flex:1;height:1px;background:var(--line)}
.sec .act{font-size:12px;font-weight:700;color:var(--gold);background:none;border:none;padding:0}
.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.big{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;padding:18px 4px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}

.btn{
  background:var(--turq);color:#04121A;border:none;border-radius:10px;
  padding:10px 15px;font-weight:800;font-size:13px;letter-spacing:.01em;
}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--white);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#221A00}
.btn.sm{padding:6px 10px;font-size:11.5px;border-radius:8px}
.btn.danger{background:rgba(255,92,122,.14);color:var(--red);border:1px solid rgba(255,92,122,.3)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- progress ---------- */
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--turq),#7BE8F4);transition:width .35s ease}
.bar.gold > i{background:linear-gradient(90deg,var(--gold),#F2DC8A)}
.bar.red > i{background:linear-gradient(90deg,var(--red),#FF9AAE)}
.ring{width:52px;height:52px;flex:0 0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:800}

/* ---------- chips ---------- */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);color:var(--muted);
  letter-spacing:.03em;
}
.chip.turq{background:rgba(25,200,219,.14);border-color:var(--line);color:var(--turq)}
.chip.gold{background:rgba(212,175,55,.14);border-color:rgba(212,175,55,.28);color:var(--gold)}
.chip.red{background:rgba(255,92,122,.14);border-color:rgba(255,92,122,.28);color:var(--red)}
.chip.green{background:rgba(63,217,160,.13);border-color:rgba(63,217,160,.28);color:var(--green)}

.av{
  width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:10.5px;font-weight:800;background:rgba(25,200,219,.18);color:var(--turq);
  border:1px solid var(--line);
}
.av.lg{width:44px;height:44px;font-size:14px}

/* ---------- tasks ---------- */
.grp{margin-bottom:14px}
.grp > .head{
  display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:11px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer;
}
.grp > .head .n{margin-left:auto;font-size:11px;font-weight:800;color:var(--muted)}
.task{
  border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;
  background:rgba(255,255,255,.03);
}
.task.late{border-color:rgba(255,92,122,.38);background:rgba(255,92,122,.05)}
.task.done{opacity:.62}
.task .t{font-weight:700;font-size:14.5px;line-height:1.25}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.sub{
  display:flex;gap:9px;align-items:flex-start;padding:8px 0;
  border-top:1px dashed rgba(255,255,255,.08);
}
.cb{
  width:18px;height:18px;flex:0 0 auto;margin-top:1px;border-radius:5px;
  border:1.5px solid var(--muted);background:transparent;display:grid;place-items:center;
  font-size:11px;color:var(--navy);padding:0;
}
.cb.on{background:var(--turq);border-color:var(--turq)}
.sub .st{font-size:13px;line-height:1.3}
.sub.done .st{text-decoration:line-through;color:var(--muted)}
.mini{font-size:10.5px;color:var(--muted);font-weight:600}
.subadd{display:flex;gap:6px;margin-top:9px}
.subadd input{
  flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);
  color:var(--white);border-radius:9px;padding:8px 10px;font-size:13px;
}
.subadd input::placeholder{color:var(--muted)}

/* ---------- kpi ---------- */
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px;background:rgba(255,255,255,.03)}
.kpi .v{display:flex;align-items:baseline;gap:6px;margin:6px 0 8px}
.kpi .v b{font-size:23px;font-weight:800;letter-spacing:-.02em}
.step{
  width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:var(--white);font-size:15px;font-weight:700;padding:0;
}
.kv{width:66px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--white);
  border-radius:9px;padding:6px 8px;text-align:center;font-weight:700;font-size:13px}

/* ---------- table-ish ---------- */
.lead{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.lead:last-child{border-bottom:none}
.rank{width:20px;text-align:center;font-weight:800;color:var(--gold);font-size:13px}

/* ---------- modal ---------- */
.ovl{
  position:fixed;inset:0;z-index:90;background:rgba(2,5,25,.72);
  backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;padding:0;
}
.sheet{
  width:100%;max-width:520px;max-height:92vh;overflow:auto;
  background:#080F3A;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px 22px;
}
@media(min-width:640px){
  .ovl{align-items:center;padding:20px}
  .sheet{border-radius:18px}
}
.sheet h3{font-size:17px;margin-bottom:14px}
.f{margin-bottom:12px}
.f > label{display:block;margin-bottom:5px}
.f input,.f select,.f textarea{
  width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--white);
  border-radius:10px;padding:10px 11px;font-size:14px;
}
.f textarea{min-height:74px;resize:vertical}
.f input[type=range]{padding:0;accent-color:var(--turq);background:transparent;border:none}
.sheet .actions{display:flex;gap:8px;margin-top:16px}
.sheet .actions .btn{flex:1;padding:12px}

/* filters */
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters select{
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--white);
  border-radius:9px;padding:7px 9px;font-size:12px;font-weight:600;flex:0 0 auto;
}
.fab{
  position:fixed;right:16px;bottom:18px;z-index:50;
  width:54px;height:54px;border-radius:50%;border:none;
  background:linear-gradient(140deg,var(--turq),#0E7F91);color:var(--navy);
  font-size:27px;font-weight:700;line-height:1;
  box-shadow:0 10px 26px rgba(0,0,0,.45);
}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="mark">E</div>
    <div>
      <div class="htitle">Emthrive</div>
      <div class="hsub">CRM intern · echipă &amp; KPI</div>
    </div>
    <button id="who" class="chip turq" style="margin-left:auto" onclick="whoAmI()">cine sunt?</button>
    <div class="sync" style="margin-left:6px"><span class="dot" id="dot"></span><span id="syncTxt">salvat</span></div>
  </div>
  <nav id="nav"></nav>
</header>

<main id="view"><div class="empty">Se încarcă…</div></main>
<button class="fab" id="fab" title="Adaugă">+</button>
<div id="modalHost"></div>

<script>
/* ============================================================
   STOCARE
============================================================ */
const KEY='emthrive_crm_v1', MEKEY='emthrive_crm_me', SHARED=true;
let S=null, ME='', TAB='dash', OPEN={}, FLT={dept:'',member:'',status:'',only:''}, KMONTH=null, EMONTH=null;

const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>new Date().toISOString().slice(0,10);
const monthISO=d=>(d||new Date()).toISOString().slice(0,7);

function setSync(state,txt){
  const d=$('#dot'); if(!d)return;
  d.className='dot'+(state==='err'?' err':state==='wait'?' wait':'');
  $('#syncTxt').textContent=txt||(state==='err'?'doar local':state==='wait'?'salvez…':'salvat');
}
async function save(){
  setSync('wait');
  try{
    if(!window.storage) throw new Error('no storage');
    await window.storage.set(KEY,JSON.stringify(S),SHARED);
    setSync('ok');
  }catch(e){ setSync('err'); }
}
async function load(){
  try{
    if(window.storage){
      const r=await window.storage.get(KEY,SHARED);
      if(r&&r.value) S=JSON.parse(r.value);
    }
  }catch(e){ /* prima rulare sau fără stocare */ }
  try{
    if(window.storage){
      const r2=await window.storage.get(MEKEY,false);
      if(r2&&r2.value) ME=r2.value;
    }
  }catch(e){ /* încă nu şi-a spus numele */ }
  if(!S||!S.departments){ S=seed(); await save(); } else setSync('ok');
  if(migrate()) await save();
}
async function setMe(id){
  ME=id||'';
  try{ if(window.storage) await window.storage.set(MEKEY,ME,false); }catch(e){}
}

/* ============================================================
   CONSTANTE
============================================================ */
const STATUS=[
  {id:'todo',n:'De făcut',c:''},
  {id:'lucru',n:'În lucru',c:'turq'},
  {id:'review',n:'În verificare',c:'gold'},
  {id:'blocat',n:'Blocat',c:'red'},
  {id:'gata',n:'Finalizat',c:'green'}
];
const PRIO=[
  {id:'critica',n:'Critică',c:'red'},
  {id:'ridicata',n:'Ridicată',c:'gold'},
  {id:'medie',n:'Medie',c:''},
  {id:'scazuta',n:'Scăzută',c:''}
];
const CRIT=[
  {id:'calitate',n:'Calitatea livrabilelor'},
  {id:'termene',n:'Respectarea termenelor'},
  {id:'comunicare',n:'Comunicare în echipă'},
  {id:'initiativa',n:'Iniţiativă &amp; idei noi'},
  {id:'autonomie',n:'Autonomie (fără supervizare)'}
];
const stName=id=>(STATUS.find(x=>x.id===id)||STATUS[0]).n;
const stCls=id=>(STATUS.find(x=>x.id===id)||STATUS[0]).c;
const prName=id=>(PRIO.find(x=>x.id===id)||PRIO[2]).n;
const prCls=id=>(PRIO.find(x=>x.id===id)||PRIO[2]).c;

/* ============================================================
   DATE INIŢIALE
============================================================ */
function seed(){
  const D=[
    {id:'mkt',n:'Marketing'},
    {id:'it',n:'IT & App'},
    {id:'sales',n:'Vânzări'},
    {id:'part',n:'Parteneriate'},
    {id:'cons',n:'Consilieri'},
    {id:'adm',n:'Administrativ & Financiar'}
  ].map(d=>({...d,leadId:''}));

  const M=[
    {id:'m1',n:'Mihaela Ciuraru',role:'Fondator & coordonator',dept:'adm'},
    {id:'m2',n:'Cristina Stângă',role:'Colaborator · parteneriate',dept:'part'}
  ].map(x=>({...x,active:true}));

  const mk=(title,dept,who,dl,tags,prio,st,subs)=>({
    id:uid(),title,dept,assignee:who,deadline:dl,priority:prio||'medie',status:st||'lucru',
    progress:0,tags:tags||[],notes:'',recurring:'',
    subtasks:(subs||[]).map(s=>({id:uid(),title:s[0],assignee:s[1]||'',deadline:s[2]||'',done:!!s[3]})),
    createdAt:todayISO(),completedAt:''
  });
  const T=[
    mk('Postări Theona (calendar advent)','mkt','m7','',['Theona'],'ridicata','lucru',
       [['Cover postare lansare advent','m7','',false],['Text postare comunitate','m7','',false]]),
    mk('Postări SuccesPlus','mkt','m7','',['SuccesPlus'],'ridicata','lucru',
       [['Cover postare SP 12 august','m7','',false],['Carusel „ce e testul vocaţional”','m7','',false]]),
    mk('Postări Emthrive','mkt','m7','',['Emthrive'],'ridicata','lucru',
       [['Poveste din şedinţele de consiliere','m7','',false],['Cover tabără Tineri de Succes','m7','',false]]),
    mk('Plugin test vocaţional — bug-uri raportate','it','m8','',['Platformă'],'ridicata','lucru',[]),
    mk('Follow-up lead-uri consultaţii telefonice','sales','m1','',[],'critica','lucru',[]),
    mk('Propuneri parteneriat licee private','part','m2','',[],'ridicata','todo',[]),
    mk('Rapoarte de consiliere restante','cons','m3','',[],'medie','lucru',[])
  ];

  const kpi=(n,dept,who,target,unit,dir)=>({id:uid(),n,dept,assignee:who||'',target,unit,dir:dir||'up',vals:{}});
  const K=[
    kpi('Postări publicate','mkt','m7',30,'buc'),
    kpi('Reach organic lunar','mkt','m7',200000,'vizualizări'),
    kpi('Lead-uri generate din social','mkt','m7',60,'lead-uri'),
    kpi('Uptime platforme','it','m8',99.5,'%'),
    kpi('Bug-uri rezolvate','it','m8',15,'buc'),
    kpi('Funcţionalităţi livrate','it','m8',3,'buc'),
    kpi('Venit lunar','sales','m1',48000,'RON'),
    kpi('Sesiuni 1:1 vândute','sales','m1',60,'sesiuni'),
    kpi('Rată de conversie consultaţie → client','sales','m1',40,'%'),
    kpi('Parteneriate noi semnate','part','m2',3,'buc'),
    kpi('Propuneri trimise','part','m2',10,'buc'),
    kpi('Sponsorizări atrase','part','m2',1500,'EUR'),
    kpi('Sesiuni susţinute / consilier','cons','',45,'sesiuni'),
    kpi('Rapoarte livrate în 48h','cons','',95,'%'),
    kpi('Satisfacţie client','cons','',9.5,'/10'),
    kpi('Rată de no-show','cons','',10,'%','down'),
    kpi('Facturi emise la timp','adm','m1',100,'%')
  ];

  return {version:1,departments:D,members:M,tasks:T,kpis:K,evals:[],weights:{exec:40,kpi:30,eval:30}};
}

/* ---------- echipa reala (se adauga o singura data, prin migrare) ---------- */
const ROSTER=[
  {n:'Olaru Dragoş',role:'IT · dezvoltare Emthrive',dept:'it'},
  {n:'Silviu Paraschiv',role:'IT · dezvoltare SuccesPlus',dept:'it'},
  {n:'Alex Chiriac',role:'Editare video · 7 postări/săptămână Emthrive',dept:'mkt'},
  {n:'Nicoleta Stamate',role:'Prezentări workshopuri · grafică statică',dept:'mkt'},
  {n:'Maria Zănoagă',role:'Postări SuccesPlus · teste şi programări',dept:'mkt'},
  {n:'David Grinberg',role:'Postări SuccesPlus · teste şi programări',dept:'mkt'},
  {n:'Daniela Lupaşcu',role:'Control documente · rapoarte consiliere',dept:'adm'},
  {n:'Cosmin',role:'Raportare financiară',dept:'adm'}
];
const ZILE=['luni','marţi','miercuri','joi','vineri','sâmbătă','duminică'];
function weekDates(){
  const d=new Date(), wd=(d.getDay()+6)%7;
  d.setDate(d.getDate()-wd);
  const out=[];
  for(let i=0;i<7;i++){ const x=new Date(d); x.setDate(d.getDate()+i); out.push(x.toISOString().slice(0,10)); }
  return out;
}
function next5th(){
  const d=new Date(); let y=d.getFullYear(), m=d.getMonth();
  if(d.getDate()>5){ m++; if(m>11){ m=0; y++; } }
  return y+'-'+String(m+1).padStart(2,'0')+'-05';
}
function ROSTER_TASKS(){
  const W=weekDates();
  return [
    {title:'Dezvoltare platformă Emthrive',dept:'it',who:'Olaru Dragoş',priority:'ridicata',tags:['Emthrive'],coverLabel:'Livrat până la'},
    {title:'Dezvoltare platformă SuccesPlus',dept:'it',who:'Silviu Paraschiv',priority:'ridicata',tags:['SuccesPlus'],coverLabel:'Livrat până la'},
    {title:'Editare video — 7 postări / săptămână Emthrive',dept:'mkt',who:'Alex Chiriac',priority:'ridicata',
      deadline:W[6],recurring:'saptamanal',tags:['Emthrive','Video'],coverLabel:'Editat până la',
      notes:'Săptămâna '+fmtDate(W[0])+' – '+fmtDate(W[6])+'. La final de săptămână apeşi „Reînnoiesc ciclul” şi subtaskurile se resetează pe săptămâna următoare.',
      subs:ZILE.map((z,i)=>['Video '+(i+1)+' · '+z,W[i]])},
    {title:'Editare clipuri de prezentare Gala (Opus Clip)',dept:'mkt',who:'Alex Chiriac',priority:'ridicata',
      tags:['Gala','Opus Clip'],coverLabel:'Clipuri gata până la'},
    {title:'Prezentări pentru workshopuri',dept:'mkt',who:'Nicoleta Stamate',priority:'medie',tags:['Emthrive','Workshop']},
    {title:'Postări statice Theona Balan — Gala + covere',dept:'mkt',who:'Nicoleta Stamate',priority:'ridicata',
      tags:['Theona','Gala'],subs:[['Set postări statice Gala',''],['Covere postări',''] ]},
    {title:'Teste + programări SuccesPlus',dept:'cons',who:'David Grinberg',priority:'ridicata',tags:['SuccesPlus'],
      coverLabel:'Programat până la',notes:'Completează în „Programat până la” data limită până la care sunt programate testele.'},
    {title:'Bibliorafturi SuccesPlus — control şi finalizare',dept:'adm',who:'Daniela Lupaşcu',priority:'medie',
      coverLabel:'Verificat până la'},
    {title:'Rapoarte Emthrive — finalizare şi trimitere către părinţi',dept:'cons',who:'Daniela Lupaşcu',priority:'ridicata',
      coverLabel:'Trimise părinţilor până la'},

function migrate(){
  let changed=false;
  if(!S.version) S.version=1;
  if(!S.weights) S.weights={exec:40,kpi:30,eval:30};
  if(S.version<2){
    const ph=['Consilier 1','Consilier 2','Consilier 3','Consilier 4','Marketing 1','Developer 1'];
    const phIds=S.members.filter(m=>ph.includes(m.n)).map(m=>m.id);
    if(phIds.length){
      S.tasks.forEach(t=>{
        if(phIds.includes(t.assignee)) t.assignee='';
        (t.subtasks||[]).forEach(x=>{ if(phIds.includes(x.assignee)) x.assignee=''; });
      });
      S.kpis.forEach(k=>{ if(phIds.includes(k.assignee)) k.assignee=''; });
      S.evals=S.evals.filter(e=>!phIds.includes(e.member));
      S.members=S.members.filter(m=>!ph.includes(m.n));
    }
    ROSTER.forEach(r=>{
      if(!S.members.some(m=>m.n===r.n)) S.members.push({id:uid(),n:r.n,role:r.role,dept:r.dept,active:true});
    });
    const ids=S.members.map(m=>m.id);
    S.tasks.forEach(t=>{
      if(t.assignee&&!ids.includes(t.assignee)) t.assignee='';
      (t.subtasks||[]).forEach(x=>{ if(x.assignee&&!ids.includes(x.assignee)) x.assignee=''; });
    });
    S.kpis.forEach(k=>{ if(k.assignee&&!ids.includes(k.assignee)) k.assignee=''; });
    const byName=n=>{ const m=S.members.find(x=>x.n===n); return m?m.id:''; };
    [['Postări SuccesPlus','Maria Zănoagă'],
     ['Postări Theona (calendar advent)','Nicoleta Stamate'],
     ['Postări Emthrive','Alex Chiriac'],
     ['Plugin test vocaţional — bug-uri raportate','Silviu Paraschiv']].forEach(pair=>{
      const tk=S.tasks.find(x=>x.title===pair[0]);
      if(tk&&!tk.assignee){ tk.assignee=byName(pair[1]); (tk.subtasks||[]).forEach(x=>{ if(!x.assignee) x.assignee=tk.assignee; }); }
    });
    [['Postări publicate','Maria Zănoagă'],['Reach organic lunar','Alex Chiriac'],
     ['Uptime platforme','Silviu Paraschiv'],['Bug-uri rezolvate','Silviu Paraschiv'],
     ['Funcţionalităţi livrate','Olaru Dragoş']].forEach(pair=>{
      const k=S.kpis.find(x=>x.n===pair[0]);
      if(k&&!k.assignee) k.assignee=byName(pair[1]);
    });
    if(!S.kpis.some(k=>k.n==='Videoclipuri editate'))
      S.kpis.push({id:uid(),n:'Videoclipuri editate',dept:'mkt',assignee:byName('Alex Chiriac'),target:28,unit:'buc',dir:'up',vals:{}});
    if(!S.kpis.some(k=>k.n==='Raportare financiară trimisă până pe 5'))
      S.kpis.push({id:uid(),n:'Raportare financiară trimisă până pe 5',dept:'adm',assignee:byName('Cosmin'),target:100,unit:'%',dir:'up',vals:{}});
    ROSTER_TASKS().forEach(d=>{
      if(S.tasks.some(t=>t.title===d.title)) return;
      const who=byName(d.who);
      S.tasks.push({id:uid(),title:d.title,dept:d.dept,assignee:who,deadline:d.deadline||'',
        priority:d.priority||'medie',status:d.status||'lucru',progress:0,tags:d.tags||[],notes:d.notes||'',
        recurring:d.recurring||'',coverLabel:d.coverLabel||'',coverDate:'',
        subtasks:(d.subs||[]).map(x=>({id:uid(),title:x[0],assignee:who,deadline:x[1]||'',done:false})),
        createdAt:todayISO(),completedAt:''});
    });
    S.version=2; changed=true;
  }
  return changed;
}

/* ============================================================
   HELPERI DE CALCUL
============================================================ */
const dep=id=>S.departments.find(d=>d.id===id);
const mem=id=>S.members.find(m=>m.id===id);
const depName=id=>{const d=dep(id);return d?d.n:'—';};
const memName=id=>{const m=mem(id);return m?m.n:'nealocat';};
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

function taskProgress(t){
  if(t.status==='gata') return 100;
  if(t.subtasks&&t.subtasks.length) return Math.round(t.subtasks.filter(s=>s.done).length/t.subtasks.length*100);
  return Number(t.progress)||0;
}
function isLate(t){
  if(!t.deadline||t.status==='gata') return false;
  return t.deadline<todayISO();
}
function daysLeft(d){
  if(!d) return null;
  return Math.round((new Date(d+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/864e5);
}
function fmtDate(d){
  if(!d) return '';
  const [y,m,dd]=d.split('-');
  return dd+'.'+m+'.'+y.slice(2);
}
function fmtNum(v){
  const n=Number(v)||0;
  return n>=1000?n.toLocaleString('ro-RO'):String(n);
}
function kpiVal(k,mth){ return Number((k.vals||{})[mth||KMONTH]||0); }
function kpiHas(k,mth){ return (k.vals||{})[mth||KMONTH]!==undefined; }
function kpiScore(k,mth){
  const v=kpiVal(k,mth), t=Number(k.target)||0;
  if(!t||!kpiHas(k,mth)) return 0;
  if(k.dir==='down') return v<=0?100:Math.max(0,Math.min(100,Math.round(t/v*100)));
  return Math.max(0,Math.min(100,Math.round(v/t*100)));
}
function memberTasks(id){ return S.tasks.filter(t=>t.assignee===id); }

function memberStats(id){
  const ts=memberTasks(id);
  const done=ts.filter(t=>t.status==='gata');
  const active=ts.filter(t=>t.status!=='gata');
  const late=active.filter(isLate);
  const onTime=done.filter(t=>!t.deadline||!t.completedAt||t.completedAt<=t.deadline).length;
  let exec=null;
  if(ts.length){
    const rate=done.length?onTime/done.length*100:null;
    const prog=active.length?active.reduce((a,t)=>a+taskProgress(t),0)/active.length:null;
    const pen=active.length?late.length/active.length*35:0;
    const parts=[]; if(rate!==null)parts.push(rate); if(prog!==null)parts.push(prog);
    exec=parts.length?Math.max(0,Math.round(parts.reduce((a,b)=>a+b,0)/parts.length-pen)):null;
  }
  const ks=S.kpis.filter(k=>k.assignee===id);
  const kp=ks.length?Math.round(ks.reduce((a,k)=>a+kpiScore(k,KMONTH),0)/ks.length):null;
  const ev=S.evals.find(e=>e.member===id&&e.month===EMONTH);
  const evs=ev?Math.round(CRIT.reduce((a,c)=>a+(Number(ev.scores[c.id])||0),0)/CRIT.length/5*100):null;

  const W=S.weights||{exec:40,kpi:30,eval:30};
  let num=0,den=0;
  if(exec!==null){num+=exec*W.exec;den+=W.exec;}
  if(kp!==null){num+=kp*W.kpi;den+=W.kpi;}
  if(evs!==null){num+=evs*W.eval;den+=W.eval;}
  const total=den?Math.round(num/den):null;
  return {tasks:ts.length,active:active.length,done:done.length,late:late.length,exec,kpi:kp,eval:evs,total};
}
function deptProgress(id){
  const ts=S.tasks.filter(t=>t.dept===id);
  if(!ts.length) return 0;
  return Math.round(ts.reduce((a,t)=>a+taskProgress(t),0)/ts.length);
}
function deptKpi(id){
  const ks=S.kpis.filter(k=>k.dept===id);
  if(!ks.length) return null;
  return Math.round(ks.reduce((a,k)=>a+kpiScore(k,KMONTH),0)/ks.length);
}

============================================================ */
function ring(pct,color){
  const p=Math.max(0,Math.min(100,pct||0)), r=22, c=2*Math.PI*r;
  const col=color||(p>=80?'var(--green)':p>=50?'var(--turq)':p>=25?'var(--gold)':'var(--red)');
  return `<div class="ring"><svg width="52" height="52" viewBox="0 0 52 52">
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5"/>
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c-c*p/100}"/>
  </svg><b>${p}</b></div>`;
}
function bar(pct,cls){
  return `<div class="bar ${cls||''}"><i style="width:${Math.max(0,Math.min(100,pct||0))}%"></i></div>`;
}
function av(id,lg){
  const m=mem(id);
  return `<div class="av ${lg?'lg':''}" title="${esc(m?m.n:'nealocat')}">${m?esc(initials(m.n)):'—'}</div>`;
}
function monthPicker(val,onchange){
  const opts=[];
  const now=new Date(); now.setDate(1);
  for(let i=-6;i<=3;i++){
    const d=new Date(now.getFullYear(),now.getMonth()+i,1);
    opts.push(monthISO(d));
  }
  if(!opts.includes(val)) opts.push(val);
  const names=['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','noi','dec'];
  return `<select onchange="${onchange}(this.value)">`+opts.map(o=>{
    const [y,m]=o.split('-');
    return `<option value="${o}" ${o===val?'selected':''}>${names[+m-1]} ${y}</option>`;
  }).join('')+`</select>`;
}

    note:'Până la ce dată este acoperit/realizat acest task (ex: programări făcute până la…, rapoarte trimise până la…).',
    fields:[
      {key:'coverLabel',label:'Etichetă',value:t.coverLabel||'Acoperit până la'},
      {key:'coverDate',label:'Dată',type:'date',value:t.coverDate||''}
    ],onSubmit:d=>{ t.coverLabel=d.coverLabel.trim()||t.coverLabel; t.coverDate=d.coverDate; }});

async function renew(id){
  const t=S.tasks.find(x=>x.id===id); if(!t) return;
  const shift=d=>{
    if(!d) return d;
    const x=new Date(d+'T00:00:00');
    if(t.recurring==='lunar') x.setMonth(x.getMonth()+1); else x.setDate(x.getDate()+7);
    return x.toISOString().slice(0,10);
  };
  if(t.deadline) t.coverDate=t.deadline;
  t.deadline=shift(t.deadline);
  (t.subtasks||[]).forEach(x=>{ x.done=false; x.deadline=shift(x.deadline); });
  t.status='lucru'; t.progress=0; t.completedAt='';
  await save(); render();
}

      recurring:d.recurring||'',coverLabel:d.coverLabel||'',coverDate:d.coverDate||'',
      createdAt:todayISO(),completedAt:d.status==='gata'?todayISO():''});
  }});
}

    t.recurring=d.recurring||'';t.coverLabel=d.coverLabel||'';t.coverDate=d.coverDate||'';
  },onDelete:()=>{S.tasks=S.tasks.filter(x=>x.id!==id);}});
}

  <div class="sec"><h2>Identitatea mea</h2><span class="rule"></span></div>
  <div class="card">
    <div class="mini" style="margin-bottom:10px">${ME&&mem(ME)?'Pe acest dispozitiv eşti '+esc(mem(ME).n)+'.':'Nu ai spus încă cine eşti pe acest dispozitiv.'}</div>
    <div class="row">
      <button class="btn ghost sm" onclick="whoAmI()">Schimb persoana</button>
      <button class="btn ghost sm" onclick="joinTeam()">Mă adaug în echipă</button>
    </div>
  </div>

  <div class="sec"><h2>Ponderi în scorul final</h2><span class="rule"></span></div>
  <div class="card">
    <div class="mini" style="margin-bottom:10px">Execuţie ${W.exec}% · KPI ${W.kpi}% · Evaluare ${W.eval}%</div>
    <button class="btn ghost sm" onclick="editWeights()">Modifică ponderile</button>
  </div>

  <div class="sec"><h2>Date</h2><span class="rule"></span></div>
  <div class="card">
    <p class="mini" style="margin:0 0 12px;line-height:1.55">Datele se salvează automat şi sunt partajate: oricine deschide această aplicaţie vede şi editează aceleaşi taskuri şi KPI. Fă un export periodic ca back-up.</p>
    <div class="row">
      <button class="btn ghost sm" onclick="exportJson()">Export back-up (JSON)</button>
      <button class="btn ghost sm" onclick="exportCsv()">Export taskuri (CSV)</button>
      <button class="btn ghost sm" onclick="importJson()">Import back-up</button>
      <button class="btn danger sm" onclick="resetAll()">Resetează tot</button>
    </div>
  </div>

  <div class="sec"><h2>Cum se calculează</h2><span class="rule"></span></div>
  <div class="card">
    <p class="mini" style="line-height:1.6;margin:0">
      <b style="color:var(--turq)">Progres task:</b> media subtaskurilor bifate; dacă nu are subtaskuri, se ia progresul manual.<br>
      <b style="color:var(--turq)">Execuţie:</b> media dintre rata de finalizare la termen şi progresul mediu pe taskurile active, minus penalizare pentru întârzieri.<br>
      <b style="color:var(--turq)">KPI:</b> realizat / ţintă pe luna selectată (invers pentru indicatorii unde mai puţin e mai bine).<br>
      <b style="color:var(--turq)">Evaluare:</b> media celor 5 criterii, notate 1–5.
    </p>
  </div>`;
}
function newDept(){
  openForm({title:'Departament nou',fields:[
    {key:'n',label:'Denumire',value:''},
    {key:'leadId',label:'Coordonator',type:'select',value:'',options:[{v:'',l:'nesetat'}].concat(S.members.map(m=>({v:m.id,l:esc(m.n)})))}
  ],onSubmit:d=>{ if(d.n.trim()) S.departments.push({id:uid(),n:d.n.trim(),leadId:d.leadId}); }});
}
function editDept(id){
  const d=dep(id);
  openForm({title:'Editează departamentul',fields:[
    {key:'n',label:'Denumire',value:d.n},
    {key:'leadId',label:'Coordonator',type:'select',value:d.leadId||'',options:[{v:'',l:'nesetat'}].concat(S.members.map(m=>({v:m.id,l:esc(m.n)})))}
  ],onSubmit:x=>{d.n=x.n.trim()||d.n;d.leadId=x.leadId;},
     onDelete:()=>{
       S.departments=S.departments.filter(z=>z.id!==id);
       S.tasks=S.tasks.filter(t=>t.dept!==id);
       S.kpis=S.kpis.filter(k=>k.dept!==id);
     }});
}
function editWeights(){
  const W=S.weights;
  openForm({title:'Ponderi scor final',note:'Se normalizează automat la 100%.',fields:[
    {key:'exec',label:'Execuţie taskuri',type:'range',min:0,max:100,step:5,value:W.exec},
    {key:'kpi',label:'Realizare KPI',type:'range',min:0,max:100,step:5,value:W.kpi},
    {key:'eval',label:'Evaluare calitativă',type:'range',min:0,max:100,step:5,value:W.eval}
  ],onSubmit:d=>{
    const e=Number(d.exec),k=Number(d.kpi),v=Number(d.eval),s=e+k+v||1;
    S.weights={exec:Math.round(e/s*100),kpi:Math.round(k/s*100),eval:Math.round(v/s*100)};
  }});
}
function dl(name,content,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:type||'application/json'}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function exportJson(){ dl('emthrive-crm-'+todayISO()+'.json',JSON.stringify(S,null,2)); }
function exportCsv(){
  const rows=[['Task','Departament','Responsabil','Termen','Prioritate','Status','Progres %','Subtaskuri','Etichete']];
  S.tasks.forEach(t=>rows.push([t.title,depName(t.dept),memName(t.assignee),t.deadline,prName(t.priority),
    stName(t.status),taskProgress(t),(t.subtasks||[]).filter(s=>s.done).length+'/'+(t.subtasks||[]).length,(t.tags||[]).join(' ')]));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  dl('emthrive-taskuri-'+todayISO()+'.csv','\ufeff'+csv,'text/csv');
}
function importJson(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json';
  i.onchange=()=>{
    const f=i.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=async()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d.departments) throw 0;
        S=d; await save(); render();
      }catch(e){ alert('Fişierul nu are structura aşteptată. Foloseşte un export făcut din această aplicaţie.'); }
    };
    r.readAsText(f);
  };
  i.click();
}
async function resetAll(){
  if(!confirm('Se şterg toate taskurile, KPI-urile şi evaluările şi se revine la structura iniţială. Continui?'))return;
  S=seed(); await save(); render();
}

/* ============================================================
   RENDER
============================================================ */
function render(){
  renderNav();
  const v=$('#view');
  v.innerHTML = TAB==='dash'?viewDash()
    : TAB==='tasks'?viewTasks()
    : TAB==='kpi'?viewKpi()
    : TAB==='team'?viewTeam()
    : viewSet();
  $('#fab').style.display = (TAB==='tasks'||TAB==='dash')?'block':'none';
  const w=$('#who');
  if(w) w.textContent = (ME&&mem(ME)) ? mem(ME).n.split(' ')[0]+' · eu' : 'cine sunt?';
}
$('#fab').onclick=()=>newTask();

(async function init(){
  KMONTH=monthISO(); EMONTH=monthISO();
  await load();
  render();
})();
</script>
</body>
</html>
